<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Hero Block</title>
  <meta name="description" content="Short, unique description of web page. Often used as the snippet shown in search results. About 120 characters is ideal.">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @layer utilities {
      .hero {
        @apply flex flex-col justify-center px-6 py-12 md:px-12 transition-colors duration-200 w-full;
      }
      .hero-content {
        @apply max-w-3xl w-full mx-auto;
      }
      .hero-light {
        @apply bg-slate-50;
      }
      .hero-light h1 {
        @apply text-slate-900;
      }
      .hero-light h2 {
        @apply text-slate-700;
      }
      .hero-dark {
        @apply bg-slate-900;
      }
      .hero-dark h1 {
        @apply text-slate-50;
      }
      .hero-dark h2 {
        @apply text-slate-300;
      }
      .hero-centre {
        @apply text-center;
      }
      .hero-centre .hero-content {
        @apply mx-auto text-center;
      }
      .hero-min-height {
        @apply min-h-[480px] md:min-h-[85vh];
      }
    }
  </style>
</head>
<body>
  <section class="hero hero-dark hero-min-height">
    <div class="hero-content">
      <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-4">Lorem ipsum dolor sit amet</h1>
        <h2 class="text-lg md:text-xl font-normal leading-relaxed">Consectetur adipiscing elit. Integer vitae libero ac risus egestas placerat.</h2>
    </div>
  </section>
</body>
</html>
